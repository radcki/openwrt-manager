[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-openwrt-router"
version = "0.1.0"
description = "Home Assistant custom integration for OpenWrt router client tracking and firewall access control"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Community Developer" }
]
dependencies = [
    "aiohttp>=3.9.0",
    "asyncssh>=2.14.0",
    "voluptuous>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "aioresponses>=0.7.6",
]
ha-test = [
    "pytest-homeassistant-custom-component>=0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # Line too long (handled by ruff format)
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["custom_components.openwrt_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
