services:
  homeassistant:
    container_name: homeassistant-dev
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      # - ./config:/config
      - ./custom_components:/config/custom_components
      - ./config/configuration.yaml:/config/configuration.yaml
    environment:
      - TZ=UTC
    restart: unless-stopped
    ports:
      - '8123:8123'
